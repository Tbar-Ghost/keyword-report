
<h2 class="sr-only">รายงาน Keyword Cost ทุกแคมเปญ Google Ads — แสดงค่าใช้จ่าย คลิก และ Conversion ของ keyword ทั้งหมด 253 คำ</h2>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1rem 0; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1.5rem; }
.metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem; }
.metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
.metric-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
.section-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 12px; }
.chart-wrap { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
.filters select, .filters input { font-size: 13px; padding: 6px 10px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); }
.filters label { font-size: 13px; color: var(--color-text-secondary); }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
th { text-align: left; padding: 8px 10px; font-weight: 500; font-size: 12px; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { color: var(--color-text-primary); }
td { padding: 8px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--color-background-secondary); }
.badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: var(--border-radius-md); font-weight: 500; }
.badge-active { background: #EAF3DE; color: #3B6D11; }
.badge-paused { background: #FAEEDA; color: #854F0B; }
.badge-removed { background: #FCEBEB; color: #A32D2D; }
.badge-conv { background: #E1F5EE; color: #0F6E56; }
.conv-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #1D9E75; margin-right: 4px; }
.zero { color: var(--color-text-secondary); }
.sort-arrow { font-size: 10px; margin-left: 3px; opacity: 0.5; }
.sort-active .sort-arrow { opacity: 1; }
.tab-bar { display: flex; gap: 0; border-bottom: 0.5px solid var(--color-border-tertiary); margin-bottom: 1.25rem; }
.tab { padding: 8px 16px; font-size: 13px; color: var(--color-text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -0.5px; }
.tab.active { color: var(--color-text-primary); font-weight: 500; border-bottom-color: var(--color-text-primary); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 10px; font-size: 12px; color: var(--color-text-secondary); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-sq { width: 10px; height: 10px; border-radius: 2px; }
.tbl-wrap { overflow-x: auto; }
</style>

<div class="wrap">
  <div class="metrics" id="metrics"></div>

  <div class="chart-wrap">

    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:22%;" onclick="sortBy('keyword')">Keyword <span class="sort-arrow">↕</span></th>

            <th style="width:9%;text-align:right;" onclick="sortBy('conversion')">Conv. <span class="sort-arrow">↕</span></th>
            <th style="width:8%;text-align:right;" onclick="sortBy('ctr')">CTR% <span class="sort-arrow">↕</span></th>
            <th style="width:14%;" onclick="sortBy('status')">สถานะ <span class="sort-arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
    <p id="tbl-count" style="font-size:12px;color:var(--color-text-secondary);margin-top:8px;"></p>
  </div>
</div>

const CAMP_COLORS = {
  'Campaign-Search-hknti-BKK-500PD': '#534AB7',
  'Campaign-Search-hknti-BKK-500PD #2': '#7F77DD',
  'GoogleAds-Accessorie-Search': '#D85A30',
  'Website_traffic-Search-English_TWN': '#185FA5',
  'Website_traffic-Search-English': '#378ADD',
  'Website_traffic-Search-Malaysia #2': '#0F6E56',
  'Website_traffic-Search-Malaysia': '#1D9E75',
  'Website_traffic-Search-Malaysia_TWN': '#5DCAA5',
  'Website_traffic-Search-Thailand_TWN': '#BA7517',
  'Website_traffic-Search-vietnam': '#993556',
  'Website_traffic-Search-vietnam_TWN': '#D4537E',
};

let sortField = 'cost', sortDir = -1;
let campChartInst, kwChartInst, convChartInst;

function renderMetrics() {
  const totalCost = RAW.reduce((s,d)=>s+d.cost,0);
  const totalClicks = RAW.reduce((s,d)=>s+d.clicks,0);
  const totalConv = RAW.reduce((s,d)=>s+d.conversion,0);
  const withSpend = RAW.filter(d=>d.cost>0).length;
  document.getElementById('metrics').innerHTML = `
    <div class="metric"><div class="metric-label">ค่าใช้จ่ายรวม (THB)</div><div class="metric-value">${totalCost.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}</div></div>
    <div class="metric"><div class="metric-label">คลิกรวม</div><div class="metric-value">${totalClicks.toLocaleString()}</div></div>
    <div class="metric"><div class="metric-label">Conversion รวม</div><div class="metric-value">${totalConv.toFixed(0)}</div></div>
    <div class="metric"><div class="metric-label">Keywords ที่มีค่าใช้จ่าย</div><div class="metric-value">${withSpend} / ${RAW.length}</div></div>
  `;
}

function renderCampChart() {
  const camps = {};
  RAW.forEach(d => { camps[d.campaign] = (camps[d.campaign]||0) + d.cost; });
  const sorted = Object.entries(camps).sort((a,b)=>b[1]-a[1]);
  const labels = sorted.map(x=>x[0].replace('Website_traffic-Search-','Website traffic-Search-').replace('Campaign-Search-','Campaign-Search-').replace('GoogleAds-Accessorie-Search','GoogleAds-Accessorie-Search'));
  const vals = sorted.map(x=>parseFloat(x[1].toFixed(2)));
  const colors = sorted.map(x=>CAMP_COLORS[x[0]]||'#888');
  const ctx = document.getElementById('campChart').getContext('2d');
  if(campChartInst) campChartInst.destroy();
  campChartInst = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label:'ค่าใช้จ่าย (THB)', data: vals, backgroundColor: colors, borderRadius: 4 }] },
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{font:{size:11},maxRotation:35,autoSkip:false}},y:{ticks:{callback:v=>'฿'+v.toLocaleString()}}}}
  });
}

function renderKwChart() {
  const top20 = [...RAW].sort((a,b)=>b.cost-a.cost).slice(0,20);
  const labels = top20.map(d=>d.keyword.length>22?d.keyword.slice(0,22)+'…':d.keyword);
  const vals = top20.map(d=>parseFloat(d.cost.toFixed(2)));
  const colors = top20.map(d=>CAMP_COLORS[d.campaign]||'#888');
  const wrapH = Math.max(420, top20.length*42);
  document.querySelector('#tab-cost > div[style]').style.height = wrapH+'px';
  const legendEl = document.getElementById('kw-legend-cost');
  const seenC = {};
  legendEl.innerHTML = top20.reduce((h,d)=>{
    if(!seenC[d.campaign]){ seenC[d.campaign]=1; h+=`<span class="legend-item"><span class="legend-sq" style="background:${CAMP_COLORS[d.campaign]||'#888'}"></span>${d.campaign.replace('Website_traffic-Search-','').replace('Campaign-Search-','CS-').replace('GoogleAds-Accessorie-Search','GoogleAds-Accessorie-Search')}</span>`; } return h;
  },'');
  const ctx = document.getElementById('kwChart').getContext('2d');
  if(kwChartInst) kwChartInst.destroy();
  kwChartInst = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ label:'ค่าใช้จ่าย (THB)', data:vals, backgroundColor:colors, borderRadius:4 }] },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{ticks:{callback:v=>'฿'+v.toLocaleString()}},y:{ticks:{font:{size:11}}}}}
  });
}

function renderConvChart() {
  const convData = RAW.filter(d=>d.conversion>0).sort((a,b)=>b.conversion-a.conversion);
  const labels = convData.map(d=>(d.keyword.length>20?d.keyword.slice(0,20)+'…':d.keyword)+' / '+d.campaign.replace('Website_traffic-Search-','').replace('Campaign-Search-','CS-').replace('GoogleAds-Accessorie-Search','GoogleAds-Accessorie-Search').slice(0,12));
  const vals = convData.map(d=>d.conversion);
  const costs = convData.map(d=>d.cost);
  const colors = convData.map(d=>CAMP_COLORS[d.campaign]||'#888');
  const wrapH = Math.max(340, convData.length*40);
  document.querySelector('#tab-conv > div[style]').style.height = wrapH+'px';
  const legendEl = document.getElementById('kw-legend-conv');
  const seenC = {};
  legendEl.innerHTML = convData.reduce((h,d)=>{
    if(!seenC[d.campaign]){ seenC[d.campaign]=1; h+=`<span class="legend-item"><span class="legend-sq" style="background:${CAMP_COLORS[d.campaign]||'#888'}"></span>${d.campaign.replace('Website_traffic-Search-','').replace('GoogleAds-Accessorie-Search','GoogleAds-Accessorie-Search')}</span>`; } return h;
  },'');
  const ctx2 = document.getElementById('convChart').getContext('2d');
  if(convChartInst) convChartInst.destroy();
  convChartInst = new Chart(ctx2, {
    type: 'bar',
    data: { labels, datasets: [{ label:'Conversions', data:vals, backgroundColor:colors, borderRadius:4 }] },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{afterLabel:(ctx)=>`ค่าใช้จ่าย: ฿${costs[ctx.dataIndex].toLocaleString('th',{minimumFractionDigits:2})}`}}}, scales:{x:{ticks:{stepSize:1}},y:{ticks:{font:{size:10}}}}}
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach((t,i)=>{ if((i===0&&tab==='cost')||(i===1&&tab==='conv')) t.classList.add('active'); });
  document.getElementById('tab-cost').style.display = tab==='cost'?'':'none';
  document.getElementById('tab-conv').style.display = tab==='conv'?'':'none';
}

function sortBy(field) {
  if(sortField===field) sortDir*=-1; else { sortField=field; sortDir=-1; }
  renderTable();
}

function renderTable() {
  const campF = document.getElementById('campFilter').value;
  const costF = document.getElementById('costFilter').value;
  const search = document.getElementById('kwSearch').value.toLowerCase();
  let data = [...RAW];
  if(campF) data = data.filter(d=>d.campaign===campF);
  if(costF==='hasSpend') data = data.filter(d=>d.cost>0);
  else if(costF==='hasConv') data = data.filter(d=>d.conversion>0);
  else if(costF==='noSpend') data = data.filter(d=>d.cost===0);
  if(search) data = data.filter(d=>d.keyword.toLowerCase().includes(search)||d.campaign.toLowerCase().includes(search));
  data.sort((a,b)=>{ const av=a[sortField],bv=b[sortField]; return (av<bv?-1:av>bv?1:0)*sortDir; });
  const body = document.getElementById('tbl-body');
  body.innerHTML = data.map(d=>{
    const badgeCls = d.status==='เปิดใช้อยู่'?'badge-active':d.status==='หยุดชั่วคราว'?'badge-paused':'badge-removed';
    const convHtml = d.conversion>0 ? `<span class="conv-dot"></span><strong>${d.conversion.toFixed(0)}</strong>` : `<span class="zero">—</span>`;
    const costHtml = d.cost>0 ? `฿${d.cost.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})}` : `<span class="zero">—</span>`;
    const ctrHtml = d.ctr>0 ? `${d.ctr.toFixed(2)}%` : `<span class="zero">—</span>`;
    return `<tr>
      <td title="${d.keyword}">${d.keyword}</td>
      <td title="${d.campaign}" style="font-size:12px;color:var(--color-text-secondary);">${d.campaign}</td>
      <td style="text-align:right;">${costHtml}</td>
      <td style="text-align:right;">${d.clicks>0?d.clicks:'<span class="zero">—</span>'}</td>
      <td style="text-align:right;">${d.impressions>0?d.impressions.toLocaleString():'<span class="zero">—</span>'}</td>
      <td style="text-align:right;">${convHtml}</td>
      <td style="text-align:right;">${ctrHtml}</td>
      <td><span class="badge ${badgeCls}">${d.status}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('tbl-count').textContent = `แสดง ${data.length} keyword จาก ${RAW.length} ทั้งหมด`;
}

function initFilters() {
  const camps = [...new Set(RAW.map(d=>d.campaign))].sort();
  const sel = document.getElementById('campFilter');
  camps.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; sel.appendChild(o); });
}

window.onload = () => {
  renderMetrics();
  renderCampChart();
  renderKwChart();
  renderConvChart();
  initFilters();
  renderTable();
};
</script>
